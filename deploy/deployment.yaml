apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1fordummies
  namespace: f1fordummies
  labels:
    app: f1fordummies
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: f1fordummies
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: f1fordummies
    spec:
      containers:
        - name: site
          # CI overwrites this image tag with the SHA of each main commit.
          image: docker.io/REPLACE_ME/f1fordummies:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: false # caddy:alpine runs as root by default; tighten in M5
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
