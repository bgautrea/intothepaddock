apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intothepaddock
  namespace: intothepaddock
  annotations:
    # Adjust if the cluster uses Traefik (kubernetes.io/ingress.class: traefik) instead.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - intothepaddock.com
        - www.intothepaddock.com
      secretName: intothepaddock-tls
  rules:
    - host: intothepaddock.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intothepaddock
                port:
                  number: 80
    - host: www.intothepaddock.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intothepaddock
                port:
                  number: 80
