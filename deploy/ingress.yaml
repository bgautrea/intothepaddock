apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intothepaddock
  namespace: intothepaddock
  annotations:
    # nginx.org/ingress-controller (NGINX Inc) is what's installed in this cluster.
    # TLS is terminated UPSTREAM at the standalone NGINX reverse proxy that fronts
    # this cluster (it owns the Let's Encrypt cert for intothepaddock.com via ACME).
    # The cluster ingress only serves plain HTTP and trusts the upstream proxy.
spec:
  ingressClassName: nginx
  rules:
    - host: intothepaddock.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intothepaddock
                port:
                  number: 80
    - host: www.intothepaddock.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intothepaddock
                port:
                  number: 80
